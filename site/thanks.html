<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Mute — شكرًا / Thank you</title>
<link rel="icon" href="/assets/icon128.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <nav><a class="brand" href="/"><img src="/assets/icon128.png" alt="">Music Mute</a><div class="links"><button class="lang" id="langBtn"></button></div></nav>
  <div class="card" style="max-width:620px;margin:40px auto;text-align:center">
    <div style="font-size:56px">🎉</div>
    <h1 data-ar="شكرًا لشرائك!" data-en="Thank you for your purchase!"></h1>
    <p class="muted" data-ar="الرخصة بتتفعّل على الإيميل اللي دفعت بيه خلال ثواني." data-en="Your license is activated on the email you paid with, within seconds."></p>
    <ol class="steps" style="text-align:start">
      <li data-ar="افتح إضافة Music Mute من شريط كروم." data-en="Open the Music Mute extension from the Chrome toolbar."></li>
      <li data-ar="سجّل دخول بنفس الإيميل اللي دفعت بيه (هيوصلك كود من 6 أرقام)." data-en="Sign in with the same email you paid with (you’ll get a 6-digit code)."></li>
      <li data-ar="لو كنت داخل قبل كده، دوس «اشتريت؟ حدّث الحالة»." data-en="Already signed in? Tap “Refresh status”."></li>
    </ol>
    <p class="muted" style="font-size:14px" id="support"></p>
  </div>
</div>
<script type="module">
import { initLang, getSettings, esc, t, $ } from '/assets/app.js';
initLang();
const S = await getSettings();
if (S.support_email) $('#support').innerHTML = t('مشكلة؟ راسلنا: ', 'Problem? Email us: ') + `<a href="mailto:${esc(S.support_email)}">${esc(S.support_email)}</a>`;
</script>
</body>
</html>
