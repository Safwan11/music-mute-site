<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Mute — شكرًا / Thank you</title>
<link rel="icon" href="/assets/icon128.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <nav><a class="brand" href="/"><img src="/assets/icon128.png" alt="">Music Mute</a><div class="links"><button class="lang" id="langBtn"></button></div></nav>
  <div class="card" style="max-width:620px;margin:40px auto;text-align:center">
    <div style="font-size:56px" id="icon">🎉</div>
    <h1 id="title" data-ar="شكرًا لشرائك!" data-en="Thank you for your purchase!"></h1>
    <p class="muted" id="sub" data-ar="الرخصة بتتفعّل على الإيميل اللي دفعت بيه خلال ثواني." data-en="Your license is activated on the email you paid with, within seconds."></p>
    <div class="msg" id="live"></div>
    <ol class="steps" style="text-align:start">
      <li data-ar="افتح إضافة Music Mute من شريط كروم." data-en="Open the Music Mute extension from the Chrome toolbar."></li>
      <li data-ar="سجّل دخول بنفس الإيميل اللي دفعت بيه (هيوصلك كود من 6 أرقام)." data-en="Sign in with the same email you paid with (you’ll get a 6-digit code)."></li>
      <li data-ar="لو كنت داخل قبل كده، دوس «اشتريت؟ حدّث الحالة»." data-en="Already signed in? Tap “Refresh status”."></li>
    </ol>
    <p class="muted" style="font-size:14px" id="support"></p>
  </div>
</div>
<script type="module">
import { sb, initLang, applyLang, getSettings, esc, t, $, msg } from '/assets/app.js';
initLang();
const S = await getSettings();

// EasyKash / PayTabs (via paytabs-return) land here with ?provider=...&status=success|pending|failed
const q = new URLSearchParams(location.search);
if (['easykash', 'paytabs'].includes(q.get('provider'))) {
  const st = (q.get('status') || '').toLowerCase();
  const set = (icon, ar, en, subAr, subEn) => {
    $('#icon').textContent = icon;
    $('#title').dataset.ar = ar; $('#title').dataset.en = en;
    $('#sub').dataset.ar = subAr; $('#sub').dataset.en = subEn;
    applyLang();
  };
  if (st === 'failed') {
    set('⚠️', 'الدفع متمّش', 'Payment did not go through',
      'محدش اتخصم منك. <a href="/buy#card">جرّب تاني</a> أو ادفع بإنستاباي.', 'You were not charged. <a href="/buy#card">Try again</a> or pay by InstaPay.');
  } else if (st === 'pending' || st === 'new') {
    const v = q.get('voucher');
    set('⏳', 'مستنيين الدفع', 'Waiting for your payment',
      (v ? `ادفع بالرقم المرجعي <b style="direction:ltr">${esc(v)}</b> في أي فرع فوري أو أمان خلال 24 ساعة. ` : '') + 'أول ما الدفع يوصل، الرخصة هتتفعّل لوحدها.',
      (v ? `Pay with reference <b>${esc(v)}</b> at any Fawry or Aman outlet within 24 hours. ` : '') + 'Your license activates automatically as soon as the payment arrives.');
  }
  // Live check: if signed in, wait for the license to appear (callback usually lands within seconds).
  const { data: { session } } = await sb.auth.getSession();
  if (session && st !== 'failed') {
    const live = $('#live');
    msg(live, t('بنتأكد من التفعيل…', 'Checking activation…'));
    for (let i = 0; i < 20; i++) {
      const { data } = await sb.rpc('my_license');
      if (data?.[0]?.active) { msg(live, t('✓ النسخة الكاملة اتفعّلت على ', '✓ Full version activated for ') + session.user.email, 'ok'); break; }
      if (i === 19) msg(live, t('لسه مستنيين تأكيد الدفع — هيتفعّل لوحده، وتقدر تقفل الصفحة.', 'Still waiting for payment confirmation — it will activate by itself; you can close this page.'));
      await new Promise((r) => setTimeout(r, 3000));
    }
  }
}
if (S.support_email) $('#support').innerHTML = t('مشكلة؟ راسلنا: ', 'Problem? Email us: ') + `<a href="mailto:${esc(S.support_email)}">${esc(S.support_email)}</a>`;
</script>
</body>
</html>
