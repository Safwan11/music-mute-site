<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Mute — الشراء / Buy</title>
<link rel="icon" href="/assets/icon128.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="/"><img src="/assets/icon128.png" alt="">Music Mute</a>
    <div class="links"><a href="/privacy" data-ar="الخصوصية" data-en="Privacy"></a><button class="lang" id="langBtn"></button></div>
  </nav>

  <h1 data-ar="النسخة الكاملة — مدى الحياة" data-en="Full version — lifetime"></h1>
  <p class="muted" data-ar="ادفع مرة واحدة. بعد الدفع افتح الإضافة واكتب نفس الإيميل واضغط «تحقّق من الدفع» — من غير أي كود."
     data-en="Pay once. Then open the extension, enter the same email and tap “Check my purchase” — no code needed."></p>

  <div class="price">
    <div class="card">
      <div class="muted" data-ar="🇪🇬 من مصر" data-en="🇪🇬 In Egypt"></div>
      <div class="amount"><span id="egp">100</span> <small data-ar="جنيه" data-en="EGP"></small></div>
      <div id="ekOffer" class="hidden">
        <p id="ekOfferText" data-ar="فيزا، ماستركارد، ميزة، المحافظ (فودافون كاش وغيرها) أو فوري — <b>بيتفعّل فورًا</b> بعد الدفع." data-en="Visa, Mastercard, Meeza, mobile wallets (Vodafone Cash etc.) or Fawry — <b>unlocks instantly</b> after payment."></p>
        <button class="btn primary" id="ekBtn" style="margin-top:14px" data-ar="ادفع بالكارت أو المحفظة" data-en="Pay by card or wallet"></button>
        <p class="muted" style="font-size:13px;margin-top:10px"><a href="#" id="egpManualLink" data-ar="أو حوّل بإنستاباي / فودافون كاش" data-en="or transfer by InstaPay / Vodafone Cash"></a></p>
      </div>
      <div id="manualOffer">
        <p data-ar="إنستاباي أو فودافون كاش — <b>بيتفعّل لوحده</b> خلال دقيقة من وصول التحويل." data-en="InstaPay or Vodafone Cash — <b>unlocks automatically</b> within a minute of your transfer arriving."></p>
        <button class="btn primary" id="egpBtn" style="margin-top:14px" data-ar="ادفع بالجنيه" data-en="Pay in EGP"></button>
      </div>
    </div>
    <div class="card">
      <div class="muted" data-ar="🌍 لكل العالم" data-en="🌍 Worldwide"></div>
      <div class="amount">$<span id="usd">9</span> <small>USD</small></div>
      <p data-ar="بالكارت أو PayPal عن طريق Gumroad — بيتفعّل فورًا بعد الدفع." data-en="Card or PayPal via Gumroad — unlocks instantly after payment."></p>
      <a class="btn gold" id="usdBtn" style="margin-top:14px" target="_blank" rel="noopener" data-ar="ادفع بالدولار" data-en="Pay in USD"></a>
        <p class="muted" style="font-size:13px;margin-top:10px" data-ar="⚠️ ادفع بنفس الإيميل اللي هتكتبه في الإضافة. دفعت بإيميل تاني؟ <a href='/activate'>فعّل بمفتاح الرخصة</a>" data-en="⚠️ Pay with the same email you’ll enter in the extension. Used another email? <a href='/activate'>Activate with your license key</a>"></p>
    </div>
  </div>

  <!-- EGP instant flow (EasyKash) -->
  <div class="card hidden" id="ekFlow" style="margin-top:20px">
    <h2 style="margin-top:0" data-ar="الدفع بالكارت أو المحفظة" data-en="Pay by card or wallet"></h2>
    <div id="ekLoginBox"></div>
    <div id="ekPayBox" class="hidden">
      <p class="muted"><span data-ar="الرخصة هتتفعّل على" data-en="The license will be activated for"></span> <b id="ekWho" style="direction:ltr;display:inline-block"></b>
        · <a href="#" id="ekSignOut" data-ar="إيميل تاني؟" data-en="Different email?"></a></p>
      <div id="ekLicensed" class="msg ok hidden" data-ar="✓ النسخة الكاملة متفعّلة على الإيميل ده بالفعل. افتح الإضافة واضغط «تحقّق من الدفع»." data-en="✓ This email already has the full version. Open the extension and tap “Check my purchase”."></div>
      <div id="ekForm">
        <label data-ar="الاسم" data-en="Name"></label>
        <input id="ekName" maxlength="80" autocomplete="name">
        <label data-ar="رقم الموبايل (مطلوب لصفحة الدفع)" data-en="Mobile number (required by the payment page)"></label>
        <input id="ekMobile" class="ltr" inputmode="tel" maxlength="11" placeholder="01xxxxxxxxx" autocomplete="tel">
        <button class="btn primary" id="ekPay" style="margin-top:14px;width:100%"><span data-ar="ادفع" data-en="Pay"></span> <span id="ekAmt">100</span> <span data-ar="جنيه" data-en="EGP"></span></button>
        <p class="muted" id="ekSecure" style="font-size:13px;margin-top:10px" data-ar="🔒 الدفع بيتم على صفحة EasyKash الآمنة. إحنا مش بنشوف بيانات الكارت." data-en="🔒 You pay on EasyKash’s secure page. We never see your card details."></p>
      </div>
      <div class="msg" id="ekMsg"></div>
    </div>
  </div>

  <!-- EGP manual flow -->
  <div class="card hidden" id="egpFlow" style="margin-top:20px">
    <h2 style="margin-top:0" data-ar="الدفع بالجنيه" data-en="Pay in EGP"></h2>
    <div id="loginBox"></div>

    <div id="payBox" class="hidden">
      <p class="muted"><span data-ar="داخل بـ" data-en="Signed in as"></span> <b id="who" style="direction:ltr;display:inline-block"></b>
        · <a href="#" id="signOut" data-ar="خروج" data-en="Sign out"></a></p>
      <div id="licensedNote" class="msg ok hidden" data-ar="✓ النسخة الكاملة متفعّلة على الإيميل ده. افتح الإضافة واضغط «تحقّق من الدفع»." data-en="✓ This email already has the full version. Open the extension and tap “Check my purchase”."></div>

      <div id="autoBox">
        <ol class="steps">
          <li data-ar="اكتب اسمك زي ما بيظهر في إنستاباي (أو رقم فودافون كاش اللي هتحوّل منه)." data-en="Enter your name as it appears in InstaPay (or the Vodafone Cash number you’ll pay from)."></li>
          <li data-ar="حوّل 100 جنيه على الرقم اللي هيظهرلك." data-en="Send 100 EGP to the number shown."></li>
          <li data-ar="أول ما الفلوس توصل، النسخة الكاملة بتتفعّل لوحدها خلال دقيقة." data-en="As soon as the money arrives, the full version unlocks by itself within a minute."></li>
        </ol>
        <label data-ar="هتدفع بـ" data-en="Pay with"></label>
        <select id="aMethod"><option value="instapay">InstaPay</option><option value="vodafone_cash">Vodafone Cash</option></select>
        <label data-ar="اسمك زي ما بيظهر في إنستاباي (أول اسمين على الأقل، بالإنجليزي)" data-en="Your name as shown in InstaPay (at least first two names)"></label>
        <input id="aName" class="ltr" maxlength="60" placeholder="AHMED MOHAMED">
        <label data-ar="رقم الموبايل اللي هتحوّل منه (مطلوب لفودافون كاش)" data-en="Mobile number you’ll pay from (required for Vodafone Cash)"></label>
        <input id="aPhone" class="ltr" inputmode="numeric" maxlength="13" placeholder="01xxxxxxxxx">
        <button class="btn primary" id="aStart" style="margin-top:14px" data-ar="ابدأ الدفع" data-en="Start payment"></button>
        <div class="msg" id="aMsg"></div>

        <div id="aPay" class="hidden" style="margin-top:16px">
          <div class="pay-box" style="text-align:center">
            <div data-ar="حوّل بالظبط" data-en="Send exactly"></div>
            <div style="font-size:40px;font-weight:800;direction:ltr" id="aAmount"></div>
            <div><span data-ar="جنيه على" data-en="EGP to"></span> <b style="direction:ltr;display:inline-block;font-size:20px" id="aTo"></b></div>
            <div class="muted" style="font-size:13px;margin-top:6px" data-ar="InstaPay أو Vodafone Cash — نفس الرقم. حوّل من الحساب اللي باسمك اللي كتبته." data-en="InstaPay or Vodafone Cash — same number. Pay from the account in the name you entered."></div>
          </div>
          <div class="msg" id="aWait"></div>
        </div>
        <p class="muted" style="font-size:13px;margin-top:14px"><a href="#" id="showManual" data-ar="حوّلت ومتفعّلش بعد 15 دقيقة؟ ابعت الإيصال هنا" data-en="Paid but not unlocked after 15 minutes? Send your receipt here"></a></p>
      </div>

      <div id="manualBox" class="hidden">
      <label data-ar="طريقة الدفع" data-en="Payment method"></label>
      <select id="method"><option value="instapay">InstaPay</option><option value="vodafone_cash">Vodafone Cash</option></select>
      <label data-ar="رقم العملية أو الرقم اللي حوّلت منه" data-en="Transaction ID or the number you paid from"></label>
      <input id="ref" class="ltr" maxlength="120">
      <label data-ar="صورة الإيصال" data-en="Receipt screenshot"></label>
      <input id="receipt" type="file" accept="image/png,image/jpeg,image/webp,application/pdf">
      <button class="btn primary" id="submitPay" style="margin-top:14px" data-ar="ابعت للمراجعة" data-en="Submit for review"></button>
      <div class="msg" id="payMsg"></div>
      </div>

      <h3 data-ar="طلباتك" data-en="Your submissions"></h3>
      <table><thead><tr><th data-ar="التاريخ" data-en="Date"></th><th data-ar="الطريقة" data-en="Method"></th><th data-ar="المرجع" data-en="Reference"></th><th data-ar="الحالة" data-en="Status"></th></tr></thead>
        <tbody id="mine"></tbody></table>
    </div>
  </div>

  <footer><span>© Music Mute</span><span id="support"></span></footer>
</div>

<script type="module">
import { sb, $, t, initLang, applyLang, msg, esc, getSettings, mountLogin } from '/assets/app.js';
initLang();
const params = new URLSearchParams(location.search);
const presetEmail = params.get('email') || '';
const S = await getSettings();
$('#egp').textContent = S.price_egp || '100';
$('#usd').textContent = S.price_usd || '9';
if (S.support_email) $('#support').innerHTML = `<a href="mailto:${esc(S.support_email)}">${esc(S.support_email)}</a>`;
if (S.creem_checkout_url) $('#usdBtn').href = S.creem_checkout_url;
else { $('#usdBtn').removeAttribute('href'); $('#usdBtn').onclick = () => alert(t('الدفع بالدولار هيتفتح قريب', 'USD checkout is coming soon')); }

const STATUS = { pending: ['قيد المراجعة', 'Pending'], approved: ['اتقبل ✓', 'Approved ✓'], rejected: ['مرفوض', 'Rejected'] };

async function showSignedIn(session) {
  $('#loginBox').classList.add('hidden'); $('#payBox').classList.remove('hidden');
  $('#who').textContent = session.user.email;
  const { data: lic } = await sb.rpc('my_license');
  $('#licensedNote').classList.toggle('hidden', !(lic?.[0]?.active));
  await loadMine();
}
async function loadMine() {
  const { data } = await sb.from('payments').select('created_at,method,reference,status,admin_note').order('created_at', { ascending: false });
  $('#mine').innerHTML = (data || []).map((p) => `<tr><td>${new Date(p.created_at).toLocaleString()}</td><td>${p.method === 'instapay' ? 'InstaPay' : 'Vodafone Cash'}</td>
    <td style="direction:ltr">${esc(p.reference)}</td><td><span class="pill ${p.status}">${t(...STATUS[p.status])}</span>${p.admin_note ? `<div class="muted" style="font-size:12px">${esc(p.admin_note)}</div>` : ''}</td></tr>`).join('')
    || `<tr><td colspan="4" class="muted">${t('لسه مفيش', 'Nothing yet')}</td></tr>`;
}

async function openEgp() {
  $('#egpFlow').classList.remove('hidden');
  $('#egpFlow').scrollIntoView({ behavior: 'smooth' });
  const { data: { session } } = await sb.auth.getSession();
  if (session) return showSignedIn(session);
  mountLogin($('#loginBox'), showSignedIn, presetEmail);
}
$('#egpBtn').onclick = openEgp;
if (params.has('email') || location.hash === '#egp') {
  const { data: { session } } = await sb.auth.getSession();
  if (session || location.hash === '#egp') openEgp();
}

// ---------- Automatic wallet payment ----------
$('#showManual').onclick = (e) => { e.preventDefault(); $('#manualBox').classList.toggle('hidden'); };
let pollTimer = null;
function waitForLicense(until) {
  clearInterval(pollTimer);
  const w = $('#aWait');
  msg(w, t('⏳ مستنيين التحويل… الصفحة دي هتتحدّث لوحدها أول ما يوصل.', '⏳ Waiting for your transfer… this page updates by itself when it arrives.'));
  pollTimer = setInterval(async () => {
    const { data: lic } = await sb.rpc('my_license');
    if (lic?.[0]?.active) {
      clearInterval(pollTimer);
      msg(w, t('✓ وصل! النسخة الكاملة اتفعّلت. افتح الإضافة واضغط «تحقّق من الدفع».', '✓ Received! The full version is active. Open the extension and tap “Check my purchase”.'), 'ok');
      $('#licensedNote').classList.remove('hidden'); loadMine();
    } else if (Date.now() > until) {
      clearInterval(pollTimer);
      msg(w, t('الطلب ده انتهى. لو حوّلت فعلًا ابعت الإيصال من اللينك تحت، أو اطلب مبلغ جديد.', 'This request expired. If you already paid, send the receipt with the link below, or get a new amount.'), 'err');
    }
  }, 5000);
}
$('#aPhone').value = localStorage.getItem('mm-mobile') || '';
$('#aName').value = localStorage.getItem('mm-payname') || '';
$('#aStart').onclick = async () => {
  const m = $('#aMsg');
  const phone = $('#aPhone').value.replace(/\D/g, '').replace(/^20(?=1)/, '0');
  const name = $('#aName').value.trim().replace(/\s+/g, ' ');
  if (name.split(' ').length < 2) return msg(m, t('اكتب أول اسمين على الأقل زي ما بيظهروا في إنستاباي', 'Enter at least your first two names as they appear in InstaPay'), 'err');
  if (phone && !/^01[0125]\d{8}$/.test(phone)) return msg(m, t('اكتب رقم مصري صحيح (11 رقم)', 'Enter a valid Egyptian number (11 digits)'), 'err');
  if ($('#aMethod').value === 'vodafone_cash' && !phone) return msg(m, t('اكتب رقم فودافون كاش اللي هتحوّل منه', 'Enter the Vodafone Cash number you’ll pay from'), 'err');
  localStorage.setItem('mm-mobile', phone); localStorage.setItem('mm-payname', name);
  $('#aStart').disabled = true; msg(m, '');
  const { data, error } = await sb.rpc('start_wallet_payment', { p_method: $('#aMethod').value, p_name: name, p_phone: phone || null });
  $('#aStart').disabled = false;
  if (error) {
    if (/already_licensed/.test(error.message)) { $('#licensedNote').classList.remove('hidden'); return; }
    return msg(m, error.message, 'err');
  }
  const r = data[0];
  $('#aAmount').textContent = Number(r.amount).toFixed(0);
  $('#aTo').textContent = r.pay_to || S.wallet_number || S.instapay_handle || '';
  $('#aPay').classList.remove('hidden');
  $('#aPay').scrollIntoView({ behavior: 'smooth', block: 'center' });
  waitForLicense(new Date(r.expires_at).getTime());
  loadMine();
};

$('#signOut').onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };

// ---------- Instant EGP by card (PayTabs or EasyKash) ----------
// Card provider: PayTabs wins if both are on.
const cardFn = S.paytabs_enabled === 'true' ? 'paytabs-checkout' : S.easykash_enabled === 'true' ? 'easykash-checkout' : null;
const ekOn = !!cardFn;
if (cardFn === 'paytabs-checkout') {
  $('#ekOfferText').dataset.ar = 'فيزا، ماستركارد أو ميزة — <b>بيتفعّل فورًا</b> بعد الدفع.';
  $('#ekOfferText').dataset.en = 'Visa, Mastercard or Meeza — <b>unlocks instantly</b> after payment.';
  $('#ekBtn').dataset.ar = 'ادفع بالكارت'; $('#ekBtn').dataset.en = 'Pay by card';
  $('#ekSecure').dataset.ar = '🔒 الدفع بيتم على صفحة PayTabs الآمنة. إحنا مش بنشوف بيانات الكارت.';
  $('#ekSecure').dataset.en = '🔒 You pay on PayTabs’ secure page. We never see your card details.';
  applyLang();
}
if (ekOn) { $('#ekOffer').classList.remove('hidden'); $('#manualOffer').classList.add('hidden'); }
$('#ekAmt').textContent = S.price_egp || '100';
$('#egpManualLink').onclick = (e) => { e.preventDefault(); $('#ekFlow').classList.add('hidden'); openEgp(); };

async function ekSignedIn(session) {
  $('#ekLoginBox').classList.add('hidden'); $('#ekPayBox').classList.remove('hidden');
  $('#ekWho').textContent = session.user.email;
  const { data: lic } = await sb.rpc('my_license');
  const has = !!lic?.[0]?.active;
  $('#ekLicensed').classList.toggle('hidden', !has);
  $('#ekForm').classList.toggle('hidden', has);
  $('#ekMobile').value = localStorage.getItem('mm-mobile') || '';
  $('#ekName').value = localStorage.getItem('mm-name') || '';
}
async function openEk() {
  $('#egpFlow').classList.add('hidden');
  $('#ekFlow').classList.remove('hidden');
  $('#ekFlow').scrollIntoView({ behavior: 'smooth' });
  const { data: { session } } = await sb.auth.getSession();
  if (session) return ekSignedIn(session);
  $('#ekLoginBox').classList.remove('hidden');
  mountLogin($('#ekLoginBox'), ekSignedIn, presetEmail);
}
$('#ekBtn').onclick = openEk;
$('#ekSignOut').onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); $('#ekPayBox').classList.add('hidden'); openEk(); };
if (ekOn && location.hash === '#card') openEk();

$('#ekPay').onclick = async () => {
  const m = $('#ekMsg');
  const mobile = $('#ekMobile').value.replace(/\D/g, '');
  const name = $('#ekName').value.trim();
  if (!/^01[0125]\d{8}$/.test(mobile)) return msg(m, t('اكتب رقم موبايل مصري صحيح (11 رقم)', 'Enter a valid Egyptian mobile number (11 digits)'), 'err');
  localStorage.setItem('mm-mobile', mobile); localStorage.setItem('mm-name', name);
  $('#ekPay').disabled = true; msg(m, t('بنجهّز صفحة الدفع…', 'Opening the payment page…'));
  try {
    const { data, error } = await sb.functions.invoke(cardFn, { body: { name, mobile } });
    if (error) {
      let detail = '';
      try { detail = (await error.context.json()).error; } catch {}
      if (detail === 'already_licensed') { $('#ekLicensed').classList.remove('hidden'); $('#ekForm').classList.add('hidden'); msg(m, ''); return; }
      throw new Error(detail || error.message);
    }
    location.href = data.url;
  } catch (e) {
    msg(m, (e.message || String(e)) + t(' — جرّب تاني أو استخدم إنستاباي.', ' — try again or use InstaPay.'), 'err');
    $('#ekPay').disabled = false;
  }
};

$('#submitPay').onclick = async () => {
  const m = $('#payMsg');
  const ref = $('#ref').value.trim();
  if (ref.length < 3) return msg(m, t('اكتب رقم العملية أو الرقم اللي حوّلت منه', 'Enter the transaction ID or the number you paid from'), 'err');
  $('#submitPay').disabled = true; msg(m, t('بنبعت…', 'Submitting…'));
  try {
    const { data: { user } } = await sb.auth.getUser();
    let receipt_path = null;
    const f = $('#receipt').files[0];
    if (f) {
      if (f.size > 5 * 1024 * 1024) throw new Error(t('الصورة أكبر من 5 ميجا', 'File is over 5 MB'));
      const ext = (f.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
      receipt_path = `${user.id}/${Date.now()}.${ext}`;
      const up = await sb.storage.from('receipts').upload(receipt_path, f, { contentType: f.type });
      if (up.error) throw up.error;
    }
    const { error } = await sb.from('payments').insert({
      method: $('#method').value, amount_egp: Number(S.price_egp || 100), reference: ref, receipt_path, email: user.email
    });
    if (error) throw error;
    msg(m, t('اتبعت ✓ هنراجعه ونفعّلك قريب.', 'Submitted ✓ We’ll review and activate you shortly.'), 'ok');
    $('#ref').value = ''; $('#receipt').value = '';
    await loadMine();
  } catch (e) { msg(m, e.message || String(e), 'err'); }
  $('#submitPay').disabled = false;
};
document.addEventListener('langchange', () => { if (!$('#payBox').classList.contains('hidden')) loadMine(); });
</script>
</body>
</html>
