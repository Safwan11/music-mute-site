<script type="module">
  import { initLang, CHROME_STORE_URL, getSettings, esc, $, $$ } from '/assets/app.js';
  // Simple illustrative waveforms (decoration, not real audio data)
  const bars = (el, music) => { for (let i = 0; i < 26; i++) { const b = document.createElement('i');
    const v = music ? 10 + ((i * 37) % 30) : (i % 6 < 3 ? 8 + ((i * 13) % 26) : 4); b.style.height = v + 'px'; el.append(b); } };
  bars($('#w1'), true); bars($('#w2'), false);
  const swap = () => { const lang = document.documentElement.lang; $$('img[data-src-ar]').forEach((im) => { im.src = im.dataset['src' + (lang === 'ar' ? 'Ar' : 'En')]; }); };
  document.addEventListener('langchange', swap);
  initLang();
  // Keep campaign tags (utm_*, ref) on links to /buy so purchases can be attributed.
  const q = new URLSearchParams(location.search); const keep = new URLSearchParams();
  for (const [k, v] of q) if (/^utm_|^ref$/.test(k)) keep.set(k, v);
  if ([...keep].length) $$('a[href="/buy"]').forEach((a) => { a.href = '/buy?' + keep.toString(); });
  if (CHROME_STORE_URL) { $('#getBtn').href = CHROME_STORE_URL; $('#getBtn2').href = CHROME_STORE_URL; }
  const S = await getSettings().catch(() => ({}));
  if (S.support_email) $('#support').innerHTML = `<a href="mailto:${esc(S.support_email)}">${esc(S.support_email)}</a>`;
  else $('#support').innerHTML = '<a href="mailto:muslimtecheg@gmail.com">muslimtecheg@gmail.com</a>';
</script>
</body>
</html>
